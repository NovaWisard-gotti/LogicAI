name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Analizar, probar y compilar
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version de Flutter
        run: flutter --version

      - name: Dependencias
        run: flutter pub get

      - name: Formato del codigo (informativo)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analisis estatico
        run: flutter analyze --no-fatal-infos

      - name: Pruebas
        run: flutter test --reporter expanded

      - name: Restaurar el wrapper de Gradle
        run: |
          cd android
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.9; fi

      - name: Compilar APK de release
        run: flutter build apk --release

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: logicai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
