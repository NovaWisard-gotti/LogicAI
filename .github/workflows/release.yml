name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publicar APK
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Pruebas
        run: flutter test

      - name: Restaurar el wrapper de Gradle
        run: |
          cd android
          if [ ! -f gradlew ]; then
            # El Gradle preinstalado en el runner es demasiado nuevo (9.x) y
            # rompe al evaluar el proyecto con Android Gradle Plugin 8.x, asi
            # que se usa una distribucion propia y compatible solo para
            # generar el wrapper.
            curl -sSL -o /tmp/gradle-bootstrap.zip https://services.gradle.org/distributions/gradle-8.14.5-bin.zip
            unzip -q /tmp/gradle-bootstrap.zip -d /tmp
            /tmp/gradle-8.14.5/bin/gradle wrapper --gradle-version 8.14.5
          fi

      - name: Compilar APK de release
        run: flutter build apk --release

      - name: Renombrar el APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/LogicAI-${GITHUB_REF_NAME}.apk"

      - name: Crear la publicacion
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
